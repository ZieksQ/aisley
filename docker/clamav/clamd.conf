Foreground yes
LogTime yes
LogClean no
LogVerbose no
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
User clamav
MaxThreads 2
MaxQueue 4
StreamMaxLength 32M
MaxFileSize 32M
MaxScanSize 64M
MaxRecursion 16
MaxFiles 2000
MaxScanTime 20000
AlertExceedsMax yes
AlertEncrypted yes
AlertOLE2Macros yes
ReadTimeout 30
CommandReadTimeout 10
SelfCheck 600
