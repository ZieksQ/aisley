name: aisley-production

x-api-environment: &api-environment
  env_file:
    - ./.env.production

x-api-build: &api-build
  build:
    context: ..
    dockerfile: docker/api/Dockerfile
  image: aisley-api:production

services:
  postgres:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in docker/.env.production}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in docker/.env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env.production}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  migrate:
    <<: [*api-environment, *api-build]
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    <<: [*api-environment, *api-build]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    image: aisley-api-nginx:production
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
      - backend

  queue:
    <<: [*api-environment, *api-build]
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  scheduler:
    <<: [*api-environment, *api-build]
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in docker/.env.production}
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - edge

volumes:
  postgres-data:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
