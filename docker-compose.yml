services:
  postgres:
    image: postgres:18.3-alpine3.23
    container_name: aisley-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - aisley-network

volumes:
  postgres-data:

networks:
  aisley-network:
    driver: bridge
